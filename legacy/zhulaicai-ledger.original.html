<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>朱来财大排档 · 记账</title>
<style>
  :root{
    --bg:#FBF5EC; --surface:#FFFFFF; --ink:#2B2420; --muted:#9A8C7E;
    --line:#EADFCF; --red:#C53D2E; --red-dark:#A32E22; --red-soft:#FBE9E5;
    --gold:#CE8A2B; --gold-soft:#FBEFD7; --ok:#2F8F5B;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; height:100%;}
  body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif; background:var(--bg); color:var(--ink); display:flex; justify-content:center;}
  .app{width:100%; max-width:460px; height:100vh; height:100dvh; display:flex; flex-direction:column; background:var(--bg); position:relative;}
  .num{font-variant-numeric:tabular-nums;}

  header{background:var(--red); color:#fff; padding:14px 16px; display:flex; align-items:center; gap:11px; flex:none;}
  .coin{width:36px; height:36px; border-radius:50%; background:var(--gold); color:#5A1C12; font-weight:700; font-size:19px; display:flex; align-items:center; justify-content:center; flex:none; box-shadow:inset 0 0 0 2px rgba(255,255,255,.35);}
  .brand{flex:1; min-width:0;}
  .brand h1{margin:0; font-size:18px; font-weight:600; letter-spacing:.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .brand p{margin:1px 0 0; font-size:11px; color:var(--gold-soft); opacity:.95;}
  .todaybox{text-align:right; flex:none;}
  .todaybox .lab{font-size:11px; opacity:.85;}
  .todaybox .val{font-size:17px; font-weight:600; line-height:1.1;}

  main{flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; padding:14px 14px 18px;}
  .seclabel{font-size:13px; color:var(--muted); margin:2px 2px 8px; font-weight:500;}

  .daterow{display:flex; align-items:center; gap:8px; background:var(--surface); border:1px solid var(--line); border-radius:13px; padding:9px 12px; margin-bottom:14px;}
  .daterow svg{width:18px; height:18px; color:var(--gold); flex:none;}
  .daterow .dtxt{flex:1; font-size:15px; font-weight:500;}
  .daterow .today-tag{font-size:11px; color:var(--ok); background:rgba(47,143,91,.12); padding:2px 8px; border-radius:20px;}
  .daterow input[type=date]{border:none; background:transparent; font:inherit; color:var(--gold); font-size:14px; font-weight:500; padding:4px 2px;}

  .cats{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-bottom:18px;}
  .cat{min-height:52px; border:1.5px solid var(--line); background:var(--surface); color:var(--ink); border-radius:13px; font-size:14px; font-weight:500; line-height:1.22; padding:6px 4px; cursor:pointer; transition:.12s; touch-action:manipulation; user-select:none;}
  .cat:active{transform:scale(.96);}
  .cat.on{background:var(--red); color:#fff; border-color:var(--red); box-shadow:0 4px 10px rgba(197,61,46,.25);}

  .amount{background:var(--surface); border:1px solid var(--line); border-radius:15px; padding:13px 16px 15px; margin-bottom:12px;}
  .amount .pick{font-size:13px; height:20px; color:var(--muted); margin-bottom:4px;}
  .amount .pick b{color:var(--red); font-weight:600;}
  .amount .disp{display:flex; align-items:baseline; gap:6px;}
  .amount .yen{font-size:22px; color:var(--gold); font-weight:600;}
  .amount .val{font-size:40px; font-weight:600; line-height:1;}
  .amount .val.zero{color:#CFC3B4;}

  .pad{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-bottom:14px;}
  .key{min-height:54px; border:1px solid var(--line); background:var(--surface); color:var(--ink); border-radius:13px; font-size:23px; font-weight:500; cursor:pointer; transition:.1s; touch-action:manipulation; user-select:none; display:flex; align-items:center; justify-content:center;}
  .key:active{background:var(--gold-soft); transform:scale(.97);}
  .key.del svg{width:25px; height:25px; color:var(--red);}

  .save{width:100%; min-height:56px; background:var(--red); color:#fff; border:none; border-radius:15px; font-size:19px; font-weight:600; cursor:pointer; transition:.12s; touch-action:manipulation; box-shadow:0 6px 14px rgba(197,61,46,.28);}
  .save:active{background:var(--red-dark); transform:scale(.985);}

  /* totals */
  .seg{display:flex; background:var(--surface); border:1px solid var(--line); border-radius:13px; padding:4px; gap:4px; margin:2px 0 12px;}
  .seg button{flex:1; border:none; background:transparent; padding:10px 0; border-radius:10px; font-size:15px; font-weight:500; color:var(--muted); cursor:pointer; touch-action:manipulation; transition:.12s;}
  .seg button.on{background:var(--red); color:#fff;}
  .pernav{display:flex; align-items:center; justify-content:center; gap:14px; margin:0 0 12px;}
  .pernav .arw{width:38px; height:38px; border-radius:50%; border:1px solid var(--line); background:var(--surface); cursor:pointer; font-size:18px; color:var(--ink); display:flex; align-items:center; justify-content:center; touch-action:manipulation;}
  .pernav .arw:active{background:var(--gold-soft);}
  .pernav .mtxt{font-size:16px; font-weight:600; min-width:140px; text-align:center; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:6px;}
  .curtag{font-size:10px; color:var(--ok); background:rgba(47,143,91,.12); padding:2px 7px; border-radius:20px; font-weight:500;}
  .bigtotal{background:var(--red); color:#fff; border-radius:16px; padding:16px 18px; margin-bottom:16px; text-align:center; box-shadow:0 6px 16px rgba(197,61,46,.22);}
  .bigtotal .lab{font-size:13px; opacity:.9;}
  .bigtotal .val{font-size:34px; font-weight:700; margin-top:2px;}
  .card{background:var(--surface); border:1px solid var(--line); border-radius:15px; padding:6px 14px 10px; margin-bottom:16px;}
  .card .ttl{font-size:13px; color:var(--muted); font-weight:500; padding:9px 0 4px;}
  .catrow{padding:9px 0; border-top:1px solid var(--line);}
  .catrow:first-of-type{border-top:none;}
  .catrow .line{display:flex; justify-content:space-between; align-items:baseline; font-size:15px;}
  .catrow .nm{font-weight:500;}
  .catrow .am{font-weight:600;}
  .bar{height:5px; background:var(--gold-soft); border-radius:4px; margin-top:6px; overflow:hidden;}
  .bar i{display:block; height:100%; background:var(--red); border-radius:4px;}

  .drillrow{display:flex; align-items:center; gap:10px; background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:12px 13px; margin-bottom:7px; cursor:pointer; touch-action:manipulation;}
  .drillrow:active{background:var(--gold-soft);}
  .drillrow .dl{flex:1;}
  .drillrow .dd{font-size:15px; font-weight:600;}
  .drillrow .dc{font-size:12px; color:var(--muted); margin-top:1px;}
  .drillrow .dv{font-size:15px; font-weight:600; color:var(--red);}
  .drillrow .ch{color:var(--muted); font-size:20px; line-height:1;}

  .entry{display:flex; align-items:center; gap:10px; background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:11px 13px; margin-bottom:7px;}
  .entry .ec{flex:1; font-size:15px;}
  .entry .ea{font-size:15px; font-weight:600;}
  .entry .del{width:30px; height:30px; border-radius:8px; border:none; background:var(--red-soft); cursor:pointer; display:flex; align-items:center; justify-content:center; flex:none; touch-action:manipulation;}
  .entry .del svg{width:16px; height:16px; color:var(--red);}

  .exportbtn{width:100%; min-height:48px; background:var(--surface); color:var(--red); border:1.5px solid var(--red); border-radius:13px; font-size:15px; font-weight:600; cursor:pointer; margin-top:4px; display:flex; align-items:center; justify-content:center; gap:8px; touch-action:manipulation;}
  .exportbtn:active{background:var(--red-soft);}
  .exportbtn svg{width:18px; height:18px;}
  .hint{font-size:12px; color:var(--muted); text-align:center; margin-top:10px; line-height:1.6;}
  .empty{text-align:center; color:var(--muted); padding:44px 20px; font-size:15px; line-height:1.7;}

  nav{flex:none; display:flex; background:var(--surface); border-top:1px solid var(--line); padding-bottom:env(safe-area-inset-bottom);}
  nav button{flex:1; border:none; background:none; padding:9px 0 10px; cursor:pointer; color:var(--muted); display:flex; flex-direction:column; align-items:center; gap:3px; font-size:12px; touch-action:manipulation;}
  nav button svg{width:23px; height:23px;}
  nav button.on{color:var(--red);}

  #toast{position:absolute; left:50%; bottom:84px; transform:translateX(-50%) translateY(10px); background:#2B2420; color:#fff; padding:11px 18px; border-radius:24px; font-size:14px; font-weight:500; opacity:0; pointer-events:none; transition:.25s; white-space:nowrap; z-index:9; box-shadow:0 8px 20px rgba(0,0,0,.2); display:flex; align-items:center; gap:14px;}
  #toast.show{opacity:1; pointer-events:auto; transform:translateX(-50%) translateY(0);}
  .tundo{background:none; border:none; color:#F0C16B; font-weight:700; font-size:14px; cursor:pointer; padding:0;}
  .hidden{display:none !important;}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="coin">财</div>
    <div class="brand"><h1>朱来财大排档</h1><p>每日开支 · 记账本</p></div>
    <div class="todaybox"><div class="lab">今天</div><div class="val num">¥<span id="todayTotal">0</span></div></div>
  </header>

  <main id="main">
    <section id="viewRecord">
      <div class="daterow">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
        <span class="dtxt">日期</span>
        <span id="todayTag" class="today-tag">今天</span>
        <input type="date" id="dateInput">
      </div>
      <div class="seclabel">记什么？（点一下选）</div>
      <div class="cats" id="catGrid"></div>
      <div class="amount">
        <div class="pick" id="pickLine">先选上面的类别</div>
        <div class="disp"><span class="yen">¥</span><span class="val zero num" id="amtVal">0</span></div>
      </div>
      <div class="pad" id="pad"></div>
      <button class="save" id="saveBtn">记一笔</button>
    </section>

    <section id="viewTotals" class="hidden">
      <div class="seg" id="granSeg">
        <button data-g="day">按天</button>
        <button data-g="month" class="on">按月</button>
        <button data-g="year">按年</button>
      </div>
      <div class="pernav">
        <button class="arw" id="prevP" aria-label="上一个">‹</button>
        <div class="mtxt" id="perTxt"></div>
        <button class="arw" id="nextP" aria-label="下一个">›</button>
      </div>
      <div class="bigtotal"><div class="lab" id="totLab">本月总开支</div><div class="val num">¥<span id="perTotal">0</span></div></div>
      <div id="totalsBody"></div>
    </section>
  </main>

  <nav>
    <button id="tabRecord" class="on" onclick="switchView('record')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>记账
    </button>
    <button id="tabTotals" onclick="switchView('totals')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3v18h18"/><rect x="7" y="11" width="3" height="6"/><rect x="12" y="7" width="3" height="10"/><rect x="17" y="13" width="3" height="4"/></svg>账目
    </button>
  </nav>

  <div id="toast"></div>
</div>

<script>
const CATS=["淡村采购","一次性用品","烧烤冻品进货","烧烤雪花牛肉","煤气","植物油","白切酱油花生油","半成品鱼片","饮料","大米","配料","鸭头鸭脚","员工菜"];
const KEY="zhulaicai_ledger_v1";
const WD=["周日","周一","周二","周三","周四","周五","周六"];
const TRASH='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m2 0v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/></svg>';
const DL='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5 5 5-5M12 15V3"/></svg>';

let entries=[], memOnly=false;
function load(){ try{ const r=localStorage.getItem(KEY); entries=r?JSON.parse(r):[]; }catch(e){ memOnly=true; entries=[]; } }
function save(){ try{ localStorage.setItem(KEY,JSON.stringify(entries)); }catch(e){ memOnly=true; } }

const round2=n=>Math.round(n*100)/100;
const fmt=n=>round2(n).toLocaleString('zh-CN',{maximumFractionDigits:2});
const pad2=n=>String(n).padStart(2,'0');
const fmtDate=d=>d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate());
const todayStr=()=>fmtDate(new Date());
function ymdLabel(s){const p=s.split('-');return p[0]+'年'+parseInt(p[1])+'月'+parseInt(p[2])+'日';}
function mdShort(s){const p=s.split('-');return parseInt(p[1])+'月'+parseInt(p[2])+'日';}
function weekday(s){return WD[new Date(s+'T00:00:00').getDay()];}

let selectedCat=null, amtStr="", curDate=todayStr();
let gran='month', viewDay=todayStr(), viewMonth=todayStr().slice(0,7), viewYear=todayStr().slice(0,4);

// ----- record -----
function buildCats(){
  const g=document.getElementById('catGrid');
  g.innerHTML=CATS.map((c,i)=>`<button class="cat" data-i="${i}">${c}</button>`).join('');
  g.querySelectorAll('.cat').forEach(b=>{ b.onclick=()=>{ const c=CATS[+b.dataset.i]; selectedCat=(selectedCat===c)?null:c; renderCats(); renderPick(); }; });
}
function renderCats(){ document.querySelectorAll('#catGrid .cat').forEach(b=>b.classList.toggle('on',CATS[+b.dataset.i]===selectedCat)); }
function renderPick(){ document.getElementById('pickLine').innerHTML=selectedCat?`正在记：<b>${selectedCat}</b>`:'先选上面的类别'; }
function buildPad(){
  const keys=['1','2','3','4','5','6','7','8','9','.','0','del'];
  document.getElementById('pad').innerHTML=keys.map(k=>k==='del'?`<button class="key del" data-k="del" aria-label="删除"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 4H8l-6 8 6 8h13a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2Z"/><path d="m15 9-6 6M9 9l6 6"/></svg></button>`:`<button class="key" data-k="${k}">${k}</button>`).join('');
  document.querySelectorAll('#pad .key').forEach(b=>b.onclick=()=>pressKey(b.dataset.k));
}
function pressKey(k){
  if(k==='del'){ amtStr=amtStr.slice(0,-1); }
  else if(k==='.'){ if(!amtStr.includes('.')) amtStr=amtStr===''?'0.':amtStr+'.'; }
  else{ if(amtStr.includes('.')&&amtStr.split('.')[1].length>=2) return; amtStr=(amtStr==='0')?k:amtStr+k; if(amtStr.replace('.','').length>9) amtStr=amtStr.slice(0,-1); }
  renderAmt();
}
function renderAmt(){ const el=document.getElementById('amtVal'); el.textContent=amtStr===''?'0':amtStr; el.classList.toggle('zero',amtStr===''||parseFloat(amtStr)===0); }
function doSave(){
  const amt=parseFloat(amtStr||'0');
  if(!selectedCat){ toast('请先选一个类别'); return; }
  if(!(amt>0)){ toast('请先填金额'); return; }
  entries.push({id:Date.now()+'_'+Math.random().toString(36).slice(2,6),date:curDate,cat:selectedCat,amt:round2(amt)});
  save(); toast('已记：'+selectedCat+' ¥'+fmt(amt));
  amtStr=""; selectedCat=null; renderCats(); renderPick(); renderAmt(); renderHeader();
}
function renderDate(){ document.getElementById('dateInput').value=curDate; document.getElementById('todayTag').style.display=(curDate===todayStr())?'inline-block':'none'; }
function renderHeader(){ const t=entries.filter(e=>e.date===todayStr()).reduce((s,e)=>s+e.amt,0); document.getElementById('todayTotal').textContent=fmt(t); }

// ----- totals -----
function setGran(g){ gran=g; document.querySelectorAll('#granSeg button').forEach(b=>b.classList.toggle('on',b.dataset.g===g)); document.getElementById('main').scrollTop=0; renderTotals(); }
function shiftPeriod(step){
  if(gran==='day'){ const d=new Date(viewDay+'T00:00:00'); d.setDate(d.getDate()+step); viewDay=fmtDate(d); }
  else if(gran==='month'){ let [y,m]=viewMonth.split('-').map(Number); m+=step; if(m<1){m=12;y--;} if(m>12){m=1;y++;} viewMonth=y+'-'+pad2(m); }
  else{ viewYear=String(Number(viewYear)+step); }
  renderTotals();
}
function resetPeriod(){ const t=todayStr(); if(gran==='day') viewDay=t; else if(gran==='month') viewMonth=t.slice(0,7); else viewYear=t.slice(0,4); renderTotals(); }

function catCard(list,title){
  const m={}; list.forEach(e=>m[e.cat]=(m[e.cat]||0)+e.amt);
  const arr=Object.keys(m).map(c=>({c,v:m[c]})).sort((a,b)=>b.v-a.v);
  const max=arr[0].v||1;
  let h=`<div class="card"><div class="ttl">${title}</div>`;
  arr.forEach(o=>{ h+=`<div class="catrow"><div class="line"><span class="nm">${o.c}</span><span class="am num">¥${fmt(o.v)}</span></div><div class="bar"><i style="width:${Math.max(4,o.v/max*100)}%"></i></div></div>`; });
  return h+'</div>';
}
function dayEntries(list){
  const items=list.slice().sort((a,b)=>a.id<b.id?1:-1);
  return items.map(e=>`<div class="entry"><span class="ec">${e.cat}</span><span class="ea num">¥${fmt(e.amt)}</span><button class="del" data-id="${e.id}" aria-label="删除">${TRASH}</button></div>`).join('');
}
function dayDrill(list){
  const m={}; list.forEach(e=>{ const o=m[e.date]=m[e.date]||{t:0,n:0}; o.t+=e.amt; o.n++; });
  return Object.keys(m).sort().reverse().map(d=>`<div class="drillrow" data-day="${d}"><div class="dl"><div class="dd">${mdShort(d)} ${weekday(d)}</div><div class="dc">${m[d].n}笔</div></div><div class="dv num">¥${fmt(m[d].t)}</div><div class="ch">›</div></div>`).join('');
}
function monthDrill(list){
  const m={}; list.forEach(e=>{ const k=e.date.slice(0,7); const o=m[k]=m[k]||{t:0,n:0}; o.t+=e.amt; o.n++; });
  return Object.keys(m).sort().map(k=>`<div class="drillrow" data-month="${k}"><div class="dl"><div class="dd">${parseInt(k.split('-')[1])}月</div><div class="dc">${m[k].n}笔</div></div><div class="dv num">¥${fmt(m[k].t)}</div><div class="ch">›</div></div>`).join('');
}
function exportSection(){ return entries.length?`<button class="exportbtn" id="exportBtn">${DL}导出全部账目（Excel/CSV）</button><div class="hint">数据存在这台手机里。建议每隔一阵导出一次做备份；<br>换手机或清理浏览器前，记得先导出。</div>`:''; }

function renderTotals(){
  const today=todayStr(); let label='',tag='',list=[];
  if(gran==='day'){ list=entries.filter(e=>e.date===viewDay); label=ymdLabel(viewDay); if(viewDay===today)tag='今天'; document.getElementById('totLab').textContent='当日总开支'; }
  else if(gran==='month'){ list=entries.filter(e=>e.date.slice(0,7)===viewMonth); const p=viewMonth.split('-'); label=p[0]+'年'+parseInt(p[1])+'月'; if(viewMonth===today.slice(0,7))tag='本月'; document.getElementById('totLab').textContent='本月总开支'; }
  else{ list=entries.filter(e=>e.date.slice(0,4)===viewYear); label=viewYear+'年'; if(viewYear===today.slice(0,4))tag='今年'; document.getElementById('totLab').textContent='本年总开支'; }
  const total=list.reduce((s,e)=>s+e.amt,0);
  document.getElementById('perTxt').innerHTML=label+(tag?` <span class="curtag">${tag}</span>`:'');
  document.getElementById('perTotal').textContent=fmt(total);

  const body=document.getElementById('totalsBody');
  if(list.length===0){ const w=gran==='day'?'这天':(gran==='month'?'这个月':'这一年'); body.innerHTML=`<div class="empty">${w}还没有记账。</div>`+exportSection(); bindExport(); return; }

  let html='';
  if(gran==='day'){ html+=dayEntries(list); }
  else if(gran==='month'){ html+=catCard(list,'按类别'); html+='<div class="seclabel" style="margin-top:2px;">按天（点开看明细）</div>'+dayDrill(list); }
  else{ html+='<div class="seclabel" style="margin-top:2px;">按月（点开看明细）</div>'+monthDrill(list)+catCard(list,'全年各类'); }
  html+=exportSection();
  body.innerHTML=html;

  if(gran==='day') body.querySelectorAll('.del').forEach(b=>b.onclick=()=>delEntry(b.dataset.id));
  else body.querySelectorAll('.drillrow').forEach(b=>b.onclick=()=>{ if(b.dataset.day) drillDay(b.dataset.day); else drillMonth(b.dataset.month); });
  bindExport();
}
function bindExport(){ const b=document.getElementById('exportBtn'); if(b) b.onclick=exportCSV; }
function drillDay(d){ viewDay=d; setGran('day'); }
function drillMonth(k){ viewMonth=k; setGran('month'); }

function delEntry(id){
  const i=entries.findIndex(e=>e.id===id); if(i<0) return;
  const removed=entries[i]; entries.splice(i,1); save(); renderTotals(); renderHeader();
  toast('已删除一笔', '撤销', ()=>{ entries.push(removed); save(); renderTotals(); renderHeader(); });
}

function exportCSV(){
  if(!entries.length){ toast('还没有账可导'); return; }
  const rows=entries.slice().sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:(a.id<b.id?-1:1));
  let csv='\uFEFF日期,类别,金额\n'; rows.forEach(e=>csv+=`${e.date},${e.cat},${e.amt}\n`);
  try{ const blob=new Blob([csv],{type:'text/csv;charset=utf-8;'}); const url=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=url; a.download='朱来财大排档-账目.csv'; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),1000); toast('已导出'); }
  catch(e){ toast('导出失败，请换浏览器打开'); }
}

function switchView(v){
  const rec=v==='record';
  document.getElementById('viewRecord').classList.toggle('hidden',!rec);
  document.getElementById('viewTotals').classList.toggle('hidden',rec);
  document.getElementById('tabRecord').classList.toggle('on',rec);
  document.getElementById('tabTotals').classList.toggle('on',!rec);
  document.getElementById('main').scrollTop=0;
  if(!rec) renderTotals();
}

let toastT;
function toast(msg,actLabel,actFn){
  const el=document.getElementById('toast');
  el.innerHTML=`<span>${msg}</span>`+(actLabel?`<button class="tundo">${actLabel}</button>`:'');
  el.classList.add('show');
  if(actLabel) el.querySelector('.tundo').onclick=()=>{ actFn(); el.classList.remove('show'); clearTimeout(toastT); };
  clearTimeout(toastT); toastT=setTimeout(()=>el.classList.remove('show'),actLabel?3800:1700);
}

renderCats(); renderPick(); renderAmt(); renderDate(); renderHeader();
document.getElementById('saveBtn').onclick=doSave;
document.getElementById('dateInput').onchange=e=>{ curDate=e.target.value||todayStr(); renderDate(); };
document.querySelectorAll('#granSeg button').forEach(b=>b.onclick=()=>setGran(b.dataset.g));
document.getElementById('prevP').onclick=()=>shiftPeriod(-1);
document.getElementById('nextP').onclick=()=>shiftPeriod(1);
document.getElementById('perTxt').onclick=resetPeriod;
if(memOnly) setTimeout(()=>toast('提示：此处不保存，请下载后用手机浏览器打开'),600);
